<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="API Wordle Dodo - Guess the payment API term in 6 tries! A Wordle-style game by Dodo Payments.">
  <meta name="keywords" content="wordle, api game, payment terms, free game, dodo games, browser game">
  <meta name="author" content="Dodo Payments">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#050505">
  <link rel="canonical" href="https://games.dodopayments.com/api-wordle-dodo/">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://games.dodopayments.com/api-wordle-dodo/">
  <meta property="og:title" content="API Wordle Dodo | Dodo Games">
  <meta property="og:description" content="Guess the payment API term in 6 tries!">
  <meta property="og:image" content="https://games.dodopayments.com/assets/images/api-wordle-dodo-og.jpg">
  <meta property="og:site_name" content="Dodo Games">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://games.dodopayments.com/api-wordle-dodo/">
  <meta name="twitter:title" content="API Wordle Dodo | Dodo Games">
  <meta name="twitter:description" content="Guess the payment API term in 6 tries!">
  <meta name="twitter:image" content="https://games.dodopayments.com/assets/images/api-wordle-dodo-og.jpg">
  <script src="../assets/analytics.js"></script>
  <link rel="icon" type="image/x-icon" href="../assets/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="../assets/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/apple-touch-icon.png">
  <link rel="manifest" href="../assets/site.webmanifest">
  <title>API Wordle Dodo | Dodo Games</title>
  <link rel="stylesheet" href="../assets/dodo-arcade.css">
  <link rel="stylesheet" href="assets/style.css">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "VideoGame",
    "name": "API Wordle Dodo",
    "description": "Guess the payment API term in six tries in this Wordle-style challenge!",
    "url": "https://games.dodopayments.com/api-wordle-dodo/",
    "image": "https://games.dodopayments.com/assets/images/api-wordle-dodo-og.jpg",
    "genre": "Puzzle",
    "gamePlatform": "Web Browser",
    "playMode": "SinglePlayer",
    "publisher": { "@type": "Organization", "name": "Dodo Payments" }
  }
  </script>
</head>
<body>
  <a href="/" class="da-back-link"><span class="da-back-link__arrow" aria-hidden="true">←</span> <span class="da-back-link__text">Back to Arcade</span></a>

  <main class="game-shell">
    <div class="wordle-topbar">
      <div class="wordle-modes" role="group" aria-label="Game mode">
        <button id="modeDaily" type="button" class="wordle-mode__btn is-active" aria-pressed="true">Daily</button>
        <button id="modeFree" type="button" class="wordle-mode__btn" aria-pressed="false">Free Play</button>
      </div>
      <button id="hardToggle" type="button" class="wordle-hard" aria-pressed="false" aria-label="Toggle hard mode">Hard</button>
    </div>

    <header class="wordle-head">
      <h1>API Wordle <span class="accent">Dodo</span></h1>
      <span class="wordle-tag" id="modeTag" aria-live="polite">Daily</span>
    </header>

    <section class="wordle-stats" aria-label="Your statistics" aria-live="polite">
      <div class="wordle-stat wordle-stat--streak">
        <span class="wordle-stat__label">Streak</span>
        <strong class="wordle-stat__value" id="statStreak">0</strong>
      </div>
      <div class="wordle-stat">
        <span class="wordle-stat__label">Max</span>
        <strong class="wordle-stat__value" id="statMax">0</strong>
      </div>
      <div class="wordle-stat">
        <span class="wordle-stat__label">Games</span>
        <strong class="wordle-stat__value" id="statGames">0</strong>
      </div>
      <div class="wordle-stat">
        <span class="wordle-stat__label">Win %</span>
        <strong class="wordle-stat__value" id="statWin">0</strong>
      </div>
    </section>

    <section id="gameBoard" class="board" aria-label="Wordle guess board"></section>

    <div id="keyboard">
      <div class="kb-row" id="kb-row-0"></div>
      <div class="kb-row" id="kb-row-1"></div>
      <div class="kb-row" id="kb-row-2"></div>
    </div>
  </main>

  <div id="toast" class="da-toast" role="status" hidden></div>

  <section id="resultOverlay" class="overlay hidden" aria-live="assertive">
    <div class="result-card">
      <p class="result-card__eyebrow" id="resultEyebrow">Settled</p>
      <h2 id="resultTitle">Nice!</h2>
      <p id="resultText"></p>
      <p class="result-term" id="resultTerm"></p>
      <div class="result-actions">
        <button id="shareBtn" type="button" class="da-btn da-btn--ghost">Share Results</button>
        <button id="newGameBtn" type="button" class="da-btn da-btn--primary">New Game</button>
      </div>
    </div>
  </section>

  <script src="../assets/dodo-juice.js"></script>
  <script src="assets/script.js"></script>
</body>
</html>
